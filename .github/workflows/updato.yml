name: Updato CDN
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Inject build-time config from repo secrets
        working-directory: Build
        run: |
          if [ -n "${{ secrets.PUBLIC_WORKER_URL }}" ]; then
            echo "PUBLIC_WORKER_URL=${{ secrets.PUBLIC_WORKER_URL }}" >> .env
          fi
          if [ -n "${{ secrets.PUBLIC_APP_URL }}" ]; then
            echo "PUBLIC_APP_URL=${{ secrets.PUBLIC_APP_URL }}" >> .env
          fi
          echo "PUBLIC_COMMIT_SHA=${{ github.sha }}" >> .env

      - name: Build
        working-directory: Build
        run: npm ci && npm run build

      - uses: NellowTCS/updato@1.0.3
        with:
          mode: commit
          dist_dir: Build/build
          github_token: ${{ secrets.GITHUB_TOKEN }}
