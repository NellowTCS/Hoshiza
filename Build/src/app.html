<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Hoshiza: a GitHub repo triage board and status map." />
		<meta name="theme-color" content="#ffffff" />
		<script>
			// Apply the saved/system theme before first paint so there is no flash.
			// Light is the default scene; dark only when the system asks for it.
			(function () {
				try {
					var t = localStorage.getItem('hoshiza_theme');
					var dark =
						t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.dataset.theme = dark ? 'dark' : 'light';
				} catch (e) {
					document.documentElement.dataset.theme = 'light';
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
